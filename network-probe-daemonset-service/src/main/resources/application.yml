spring:
  main:
    # This daemon initiates probes and reports results; it exposes no HTTP API.
    # Disabling the embedded web server avoids hostNetwork port 8080 conflicts
    # with the data-discovery Agent already running on every storage node.
    web-application-type: none

local:
  cluster:
    id: ${LOCAL_CLUSTER_ID:in-cluster-default}
  node:
    name: ${LOCAL_NODE_NAME:local-test-node}
central:
  public-ip:
    url: ${CENTRAL_PUBLIC_IP_URL:http://practice-server-svc:8080/api/network/nodes/public-ip}
  metrics:
    url: ${CENTRAL_METRICS_URL:http://practice-server-svc:8080/api/network/metrics/batch}
probe:
  public-ip:
    url: ${PUBLIC_IP_LOOKUP_URL:https://api-ipv4.ip.sb/ip}
    initial-delay-ms: ${PUBLIC_IP_INITIAL_DELAY_MS:10000}
    interval-ms: ${PUBLIC_IP_INTERVAL_MS:600000}
  all:
    nodes: ${PROBE_ALL_NODES:false}
  target:
    edges: ${PROBE_TARGET_EDGES:master-88/master-89,master-88/master-90,master-89/master-90,alihz/master-88,alish/master-88,alibj/master-90}
  transfer:
    bytes: ${PROBE_TRANSFER_BYTES:5242880}
  interval:
    ms: ${PROBE_INTERVAL_MS:86400000}
  initial-delay:
    ms: ${PROBE_INITIAL_DELAY_MS:30000}
