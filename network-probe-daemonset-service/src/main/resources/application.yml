spring:
  main:
    # This daemon initiates probes and reports results; it exposes no HTTP API.
    # Disabling the embedded web server avoids hostNetwork port 8080 conflicts
    # with the data-discovery Agent already running on every storage node.
    web-application-type: none

local:
  node:
    name: ${LOCAL_NODE_NAME:local-test-node}
central:
  metrics:
    url: ${CENTRAL_METRICS_URL:http://practice-server-svc:8080/api/network/metrics/batch}
probe:
  all:
    nodes: ${PROBE_ALL_NODES:false}
  interval:
    ms: ${PROBE_INTERVAL_MS:600000}
  initial-delay:
    ms: ${PROBE_INITIAL_DELAY_MS:30000}
