apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: topic4-master215-aliyun-route
  namespace: topic4-1
  labels:
    app: topic4-master215-aliyun-route
spec:
  selector:
    matchLabels:
      app: topic4-master215-aliyun-route
  template:
    metadata:
      labels:
        app: topic4-master215-aliyun-route
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: master-215
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: route-keeper
          image: 10.15.16.40:30455/data-discovery-network-probe:v-a3bd2e4f5d152f6432754a852c5d50ed0c64d8a5
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              while true; do
                ip route replace 10.214.0.0/24 via 10.15.16.40
                iptables-legacy -t nat -C POSTROUTING \
                  -s 10.214.0.0/24 -d 10.15.0.0/16 -o ens25f2 \
                  -j SNAT --to-source 10.15.17.215 2>/dev/null || \
                  iptables-legacy -t nat -I POSTROUTING 1 \
                    -s 10.214.0.0/24 -d 10.15.0.0/16 -o ens25f2 \
                    -j SNAT --to-source 10.15.17.215
                sleep 60
              done
          securityContext:
            privileged: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  ip route show 10.214.0.0/24 | grep -Fq 'via 10.15.16.40' &&
                  iptables-legacy -t nat -C POSTROUTING
                  -s 10.214.0.0/24 -d 10.15.0.0/16 -o ens25f2
                  -j SNAT --to-source 10.15.17.215
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
