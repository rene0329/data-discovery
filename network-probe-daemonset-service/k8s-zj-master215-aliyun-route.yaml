apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: topic4-master215-aliyun-route
  namespace: topic4-1
  labels:
    app: topic4-master215-aliyun-route
spec:
  selector:
    matchLabels:
      app: topic4-master215-aliyun-route
  template:
    metadata:
      labels:
        app: topic4-master215-aliyun-route
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: master-215
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: route-keeper
          image: 10.15.16.40:30455/data-discovery-network-probe:v-a3bd2e4f5d152f6432754a852c5d50ed0c64d8a5
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              ensure_nat_rule() {
                iptables-legacy -w 5 -t nat -C POSTROUTING \
                  -s 10.214.0.0/24 -d 10.15.0.0/16 -o ens25f2 \
                  -j SNAT --to-source 10.15.17.215 2>/dev/null || \
                iptables-legacy -w 5 -t nat -I POSTROUTING 1 \
                  -s 10.214.0.0/24 -d 10.15.0.0/16 -o ens25f2 \
                  -j SNAT --to-source 10.15.17.215
              }

              ensure_route_and_nat() {
                ip route replace 10.214.0.0/24 via 10.15.16.40
                ensure_nat_rule
              }

              ensure_route_and_nat
              while sleep 300; do
                ensure_route_and_nat
              done
          securityContext:
            privileged: true
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - ip route show 10.214.0.0/24 | grep -Fq 'via 10.15.16.40'
            initialDelaySeconds: 2
            timeoutSeconds: 2
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
