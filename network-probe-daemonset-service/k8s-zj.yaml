apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-probe
  namespace: topic4-1
  labels:
    app: network-probe
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: network-probe
  template:
    metadata:
      labels:
        app: network-probe
    spec:
      # Reuse the existing ZJ node-reader binding for topic4-1/default.
      serviceAccountName: default
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: network-probe
          image: 10.15.16.40:30455/data-discovery-network-probe:v-51f5ab8db499d855e04895ae71ce68cbb1d9f64c
          imagePullPolicy: IfNotPresent
          env:
            - name: LOCAL_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CENTRAL_METRICS_URL
              # 阿里云节点不能转发集群 Service/Pod 网段，使用专线可达的 master-40 NodePort。
              value: http://10.15.16.40:30482/api/network/metrics/batch
            - name: CENTRAL_NODE_HEARTBEAT_URL
              value: http://10.15.16.40:30482/api/network/nodes/heartbeat
            - name: CENTRAL_PROBE_DECISION_URL
              value: http://10.15.16.40:30482/api/network/probe-decision
            - name: LOCAL_CLUSTER_ID
              value: in-cluster-default
            - name: CENTRAL_PUBLIC_IP_URL
              value: http://10.15.16.40:30482/api/network/nodes/public-ip
            - name: CENTRAL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: internal-agent-token
            - name: PUBLIC_IP_LOOKUP_URL
              value: https://api-ipv4.ip.sb/ip
            - name: PUBLIC_IP_INTERVAL_MS
              value: "600000"
            - name: PROBE_ALL_NODES
              value: "true"
            - name: PROBE_TARGET_EDGES
              value: master-40/master-141,master-40/master-215,master-141/master-215,cluster-bj-1/cluster-bj-2,cluster-sh-1/cluster-sh-2,cluster-sh-1/cluster-sh-3,cluster-sh-2/cluster-sh-3,cluster-sz-1/cluster-sz-2,cluster-sz-1/cluster-sz-3,cluster-sz-2/cluster-sz-3,cluster-bj-1/master-40,cluster-sh-1/master-40,cluster-sz-1/master-215,cluster-hz-1/master-141
            - name: PROBE_EXTERNAL_RUNNER_NODE
              value: master-40
            - name: PROBE_EXTERNAL_CLUSTER_ID
              value: zj-external-aliyun
            - name: PROBE_EXTERNAL_EDGES
              value: ""
            - name: PROBE_EXTERNAL_HEARTBEAT_INTERVAL_MS
              value: "60000"
            - name: PROBE_TRANSFER_SECONDS
              value: "2"
            - name: PROBE_INTERVAL_MS
              # Five-minute measurements keep adaptive throttling responsive
              # without running iperf continuously.
              value: "300000"
            - name: PROBE_INITIAL_DELAY_MS
              value: "30000"
            - name: PROBE_NODE_LAN_IP_OVERRIDES
              value: cluster-bj-1=172.28.115.14,cluster-bj-2=172.28.115.13,cluster-sh-1=172.28.241.199,cluster-sh-2=172.28.241.198,cluster-sh-3=172.28.241.196,cluster-sz-1=172.28.225.69,cluster-sz-2=172.28.225.70,cluster-sz-3=172.28.225.68
          ports:
            - name: iperf3
              containerPort: 5201
              hostPort: 5201
          readinessProbe:
            tcpSocket:
              port: iperf3
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
