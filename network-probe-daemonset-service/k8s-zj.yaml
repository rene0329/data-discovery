apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-probe
  namespace: topic4-1
  labels:
    app: network-probe
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: network-probe
  template:
    metadata:
      labels:
        app: network-probe
    spec:
      # Reuse the existing ZJ node-reader binding for topic4-1/default.
      serviceAccountName: default
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: network-probe
          image: 10.15.16.40:30455/data-discovery-network-probe:v-72d7d8948aa1f301aec3c3a8d4f77773627926b0
          imagePullPolicy: IfNotPresent
          env:
            - name: LOCAL_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CENTRAL_METRICS_URL
              # master-141 的主机网络无法转发 ClusterIP，headless DNS 直接解析后端 Pod。
              value: http://practice-server-headless.topic4-1.svc.cluster.local:8080/api/network/metrics/batch
            - name: LOCAL_CLUSTER_ID
              value: in-cluster-default
            - name: CENTRAL_PUBLIC_IP_URL
              value: http://practice-server-headless.topic4-1.svc.cluster.local:8080/api/network/nodes/public-ip
            - name: CENTRAL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: internal-agent-token
            - name: PUBLIC_IP_LOOKUP_URL
              value: https://api-ipv4.ip.sb/ip
            - name: PUBLIC_IP_INTERVAL_MS
              value: "600000"
            - name: PROBE_ALL_NODES
              value: "true"
            - name: PROBE_TARGET_EDGES
              value: master-40/master-141,master-40/master-215,master-141/master-215
            - name: PROBE_TRANSFER_BYTES
              value: "5242880"
            - name: PROBE_INTERVAL_MS
              value: "86400000"
            - name: PROBE_INITIAL_DELAY_MS
              value: "30000"
          ports:
            - name: iperf3
              containerPort: 5201
              hostPort: 5201
          readinessProbe:
            tcpSocket:
              port: iperf3
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
