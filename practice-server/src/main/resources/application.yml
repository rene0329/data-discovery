# 任务编排执行控制参数
app:
  orchestrator:
    job-wait-timeout-minutes: 30
    job-max-retries: 1
    job-retry-backoff-seconds: 5
    wait-for-processing-completion: false
    status-poll-interval-ms: 1000

  storage-transfer:
    connect-timeout-ms: 5000
    read-timeout-ms: 600000

  node-sync:
    enabled: true   # 仅 practice-server 启用，heat-update-cronjob 不设此属性故默认 false

  heat-update:
    alpha: 0.99
    k: 0.05
    lambda0: 0.05
    beta: 0.3
    time: 10
    threshold: 10

# 禁用 Redis 健康检查（Redis 未实际使用，避免连接失败导致 /actuator/health 报 DOWN）
