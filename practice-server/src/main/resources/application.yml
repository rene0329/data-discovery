server:
  port: 8080

spring:
  profiles:
    active: prod # 在K8s中通常激活生产环境profile
  main:
    allow-circular-references: true # 这个配置可以保留
  application:
    name: practice-server # 应用名称，用于日志和K8s标签

  datasource:
    druid: # 或者使用 hikari，你的application-dev.yml中是hikari
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://10.15.16.40:34036/Project4?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
      username: root
      password: ibdiibdi
    # 你的 application-dev.yml 中有 Hikari 配置，如果项目中使用的是 Hikari，请使用以下配置块并注释掉 Druid
    # hikari:
    #   driver-class-name: com.mysql.cj.jdbc.Driver
    #   url: jdbc:mysql://mysql-service.default.svc.cluster.local:3306/Subject4?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
    #   connection-timeout: 30000
    #   maximum-pool-size: 10
    #   minimum-idle: 5


  redis:
    host: redis-service.default.svc.cluster.local # 假设Redis在K8s内部，Service名为redis-service
    port: 6379
    database: 10
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
    timeout: 5000ms

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    org.example: DEBUG # 为你的项目包设置更详细的日志级别，方便调试
    io.fabric8: WARN # 减少fabric8的日志输出，避免刷屏
    com.sky.mapper: debug # 调整为适合K8s的日志级别
    com.sky.service: info
    com.sky.controller: info

# ===================================================================
# 你的自定义配置 (原先在 practice 块中，现在平铺，以便 @Value("${dispatch.*}") 直接获取)
# ===================================================================

# 对应 K8sJobFactory 中的 @Value("${dispatch.kubeconfig.path}")
# 在K8s中，K8sJobFactory会优先In-Cluster，这个路径不会被实际使用
# 在本地开发时，如果In-Cluster失败，会尝试加载此路径
dispatch:
  kubeconfig:
    path: C:/Users/xuty/.kube/config # 本地开发时使用的kubeconfig路径
  cluster:
    domain: cluster.local # 对应 K8sJobFactory 中的 @Value("${dispatch.cluster.domain}")
  job:
    image:
      init: curlimages/curl:latest # init container 镜像，支持 --limit-rate 限速（busybox wget 不支持）
      main: python:3.9-slim # 对应 K8sJobFactory 中的 @Value("${dispatch.job.image.main}")
    curl:
      limit-rate:
        default: 5m             # 全局兜底限速（未匹配具体路径时生效），同时拉低整体传输速度
        141-to-40: 8m           # master-141 → master-40（存储节点到计算+存储节点，稍快）
        141-to-215: 5m          # master-141 → master-215（存储节点到纯计算节点，较慢）
        40-to-215: 10m          # master-40  → master-215（计算+存储节点到纯计算节点，最快）
  central-node:
    name: "master-215" # 中心节点，需在 node_management 表中存在 # 对应 K8sTaskOrchestratorService 中的 @Value("${dispatch.central-node.name}")
  # data-discovery DaemonSet 配置（hostNetwork 模式，直接用节点 IP 访问）
  data-discovery:
    port: 8080  # Pod 监听端口，与 containerPort 保持一致
  scheduler:
    in-place-baseline-ms: 50      # 兜底值：文件大小为0时使用(ms)
    in-place-rate: 15m             # 原地调度模拟本地读取速率；需 > 最快网络路径(10m)，15m使 40→215路径ratio≈1.37
  training:
    n-epochs: 1                    # 训练轮数，注入到训练容器 N_EPOCHS 环境变量


