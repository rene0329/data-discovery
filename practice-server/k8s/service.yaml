apiVersion: v1
kind: Service
metadata:
  name: practice-server-svc
  namespace: topic4-1
  labels:
    app: practice-server
spec:
  type: NodePort
  selector:
    app: practice-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081        # 改为你想要的端口（30000-32767）
      name: http
      protocol: TCP
