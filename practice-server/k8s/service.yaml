apiVersion: v1
kind: Service
metadata:
  name: practice-server-svc
  namespace: topic4-1
  labels:
    app: practice-server
spec:
  type: NodePort
  selector:
    app: practice-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31081        # 对外后端 API；任一集群节点 IP 均可访问
      name: http
      protocol: TCP
