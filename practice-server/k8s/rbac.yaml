apiVersion: v1
kind: ServiceAccount
metadata:
  name: practice-server-sa
  namespace: topic4-1
---
# 后端节点同步只需要读取集群节点。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: practice-server-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: practice-server-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: practice-server-sa
    namespace: topic4-1
roleRef:
  kind: ClusterRole
  name: practice-server-node-reader
  apiGroup: rbac.authorization.k8s.io
---
# 授予后端 ServiceAccount 在 default 命名空间创建/管理 Job 的权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-manager
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-manager-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: practice-server-sa
    namespace: topic4-1
roleRef:
  kind: Role
  name: job-manager
  apiGroup: rbac.authorization.k8s.io
