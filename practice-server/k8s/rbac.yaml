# 授予 topic4-1 命名空间的 default ServiceAccount 在 default 命名空间创建/管理 Job 的权限
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-manager
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-manager-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: default
    namespace: topic4-1
roleRef:
  kind: Role
  name: job-manager
  apiGroup: rbac.authorization.k8s.io
