apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-server
  namespace: topic4-1
  labels:
    app: practice-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practice-server
  template:
    metadata:
      labels:
        app: practice-server
    spec:
      serviceAccountName: practice-server-sa
      nodeSelector:
        kubernetes.io/hostname: master-90
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: practice-server
          image: ghcr.io/rene0329/data-discovery-practice-server:latest
          # latest 是可变标签；每次滚动都检查远端摘要，避免继续运行节点缓存的旧后端。
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DISPATCH_CENTRAL_NODE_IP
              value: "10.212.14.90"
            - name: DISPATCH_CENTRAL_NODE_NAME
              value: "master-90"
            - name: TZ
              value: "UTC"
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=UTC"
            - name: APP_RUNTIME_IMAGE_VERIFY_NAMESPACE
              value: "topic4-1"

            # MySQL
            - name: SPRING_DATASOURCE_DRUID_URL
              value: "jdbc:mysql://mysql.topic4-1.svc.cluster.local:3306/Project4?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&sessionVariables=time_zone='%2B00:00'"
            - name: SPRING_DATASOURCE_DRUID_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_DRUID_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project4-mysql-secret
                  key: root-password

            # Redis（与 application.yml 中 host 保持一致）
            - name: SPRING_REDIS_HOST
              value: "redis-service.default.svc.cluster.local"
            - name: SPRING_REDIS_PORT
              value: "26379"
            - name: SPRING_REDIS_DATABASE
              # 新集群使用 Redis Cluster，只支持 database 0。
              value: "0"

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
