apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-server
  namespace: topic4-1
  labels:
    app: practice-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practice-server
  template:
    metadata:
      labels:
        app: practice-server
    spec:
      serviceAccountName: practice-server-sa
      nodeSelector:
        kubernetes.io/hostname: master-90
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: practice-server
          image: ghcr.io/rene0329/data-discovery-practice-server:latest
          # latest 是可变标签；每次滚动都检查远端摘要，避免继续运行节点缓存的旧后端。
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DISPATCH_CENTRAL_NODE_IP
              value: "10.212.14.90"
            - name: DISPATCH_CENTRAL_NODE_NAME
              value: "master-90"
            - name: TZ
              value: "UTC"
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=UTC"
            - name: APP_AUTH_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: jwt-signing-key
            - name: APP_AUTH_INTERNAL_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: internal-agent-token
            - name: APP_AUTH_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: bootstrap-admin-username
            - name: APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: bootstrap-admin-password
            - name: APP_AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME
              value: "System Administrator"
            - name: PRIVACY_LEGACY_A_DATASET_ID
              value: "28"
            - name: PRIVACY_LEGACY_A_DATASET_VERSION
              value: "v1"
            - name: PRIVACY_LEGACY_A_FIELDS
              value: "value"
            - name: PRIVACY_LEGACY_B_DATASET_ID
              value: "29"
            - name: PRIVACY_LEGACY_B_DATASET_VERSION
              value: "v1"
            - name: PRIVACY_LEGACY_B_FIELDS
              value: "value"
            - name: PRIVACY_LEGACY_C_DATASET_ID
              value: "30"
            - name: PRIVACY_LEGACY_C_DATASET_VERSION
              value: "v1"
            - name: PRIVACY_LEGACY_C_FIELDS
              value: "value"
            - name: APP_RUNTIME_IMAGE_VERIFY_NAMESPACE
              value: "topic4-1"
            # Match the daily bounded network probe plus a two-hour reporting allowance.
            - name: APP_NETWORK_TOPOLOGY_STALE_AFTER_SECONDS
              value: "93600"
            - name: APP_DATASET_ACCESS_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: dataset-access-hmac
                  optional: true
            - name: APP_DATASET_ACCESS_REVIEWER_A_SECRET
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: reviewer-a-secret
                  optional: true
            - name: APP_DATASET_ACCESS_REVIEWER_B_SECRET
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: reviewer-b-secret
                  optional: true
            - name: APP_SECURE_AGGREGATION_WORKER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: aggregation-worker-auth
                  optional: true
            - name: PRIVACY_PARTY_A_NODE_NAME
              value: "alibj"
            - name: PRIVACY_PARTY_B_NODE_NAME
              value: "alihz"
            - name: PRIVACY_PARTY_C_NODE_NAME
              value: "alish"
            - name: PRIVACY_MP_SPDZ_BASE_URL
              value: "http://topic4-privacy-mpspdz-gateway.kuscia-master.svc.cluster.local:8080"
            - name: PRIVACY_SECRETFLOW_BASE_URL
              value: "http://topic4-privacy-secretflow-gateway.kuscia-master.svc.cluster.local:8080"
            - name: PRIVACY_APSI_BASE_URL
              value: "http://topic4-privacy-apsi-gateway.kuscia-master.svc.cluster.local:8080"
            - name: PRIVACY_SFL_BASE_URL
              value: "http://topic4-privacy-sfl-gateway.kuscia-master.svc.cluster.local:8080"
            - name: PRIVACY_MP_SPDZ_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: privacy-mpspdz-token
            - name: PRIVACY_SECRETFLOW_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: privacy-secretflow-token
            - name: PRIVACY_APSI_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: privacy-apsi-token
            - name: PRIVACY_SFL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: privacy-sfl-token

            # MySQL
            - name: SPRING_DATASOURCE_DRUID_URL
              value: "jdbc:mysql://mysql.topic4-1.svc.cluster.local:3306/Project4?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&sessionVariables=time_zone='%2B00:00'"
            - name: SPRING_DATASOURCE_DRUID_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_DRUID_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project4-mysql-secret
                  key: root-password

            # Redis（与 application.yml 中 host 保持一致）
            - name: SPRING_REDIS_HOST
              value: "redis-service.default.svc.cluster.local"
            - name: SPRING_REDIS_PORT
              value: "26379"
            - name: SPRING_REDIS_DATABASE
              # 新集群使用 Redis Cluster，只支持 database 0。
              value: "0"

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
