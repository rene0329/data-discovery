apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-server
  namespace: topic4-1
  labels:
    app: practice-server
spec:
  replicas: 1
  # Task execution is owned by one JVM; stop it before startup recovery runs in its replacement.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: practice-server
  template:
    metadata:
      labels:
        app: practice-server
    spec:
      # ZJ 的 topic4-1/default 已绑定现有节点与指标只读权限，避免新增集群级 RBAC。
      serviceAccountName: default
      nodeSelector:
        kubernetes.io/hostname: master-40
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: practice-server
          image: 10.15.16.40:30455/data-discovery-practice-server:v-cf9a02e443980dee0b3110a3cfac215e2bc1025c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DISPATCH_CENTRAL_NODE_IP
              value: "10.15.16.40"
            - name: DISPATCH_CENTRAL_NODE_NAME
              value: "master-40"
            # 同域与分布式路径使用统一基准 1408k。跨域路径按相对于浙江中心的物理距离
            # 使用经实测时间开销校准的系数：杭州 0.767045、上海 0.704545、北京 0.659091、深圳 0.596591。
            # 系数随物理距离递减，同时补偿公网连接、校验与链路抖动对实测时长的影响。规则按顺序匹配：
            # 先匹配中心路径和同域路径，
            # 再匹配分布式备选节点与其他跨域路径。
            - name: DISPATCH_JOB_CURL_LIMIT_RATE_DEFAULT
              value: "1408k"
            - name: DISPATCH_JOB_CURL_LIMIT_RATE_PATHS
              value: >-
                cluster-hz-1->cluster-hz-1=1408k,
                cluster-hz-1->master-40=1080k,
                cluster-sh-1->master-40=992k,cluster-sh-2->master-40=992k,cluster-sh-3->master-40=992k,
                cluster-bj-1->master-40=928k,cluster-bj-2->master-40=928k,
                cluster-sz-1->master-40=840k,cluster-sz-2->master-40=840k,cluster-sz-3->master-40=840k,
                cluster-sh-2->cluster-sh-1=1408k,cluster-sh-3->cluster-sh-1=1408k,
                cluster-sz-2->cluster-sz-1=1408k,cluster-sz-3->cluster-sz-1=1408k,
                cluster-bj-2->cluster-bj-1=1408k,
                *->master-215=1408k,
                *->cluster-sh-1=992k,*->cluster-bj-1=928k,*->cluster-sz-1=840k,
                cluster-hz-1->*=1080k,
                cluster-sh-1->*=992k,cluster-sh-2->*=992k,cluster-sh-3->*=992k,
                cluster-bj-1->*=928k,cluster-bj-2->*=928k,
                cluster-sz-1->*=840k,cluster-sz-2->*=840k,cluster-sz-3->*=840k
            - name: TZ
              value: "UTC"
            - name: JAVA_TOOL_OPTIONS
              # Druid 1.2.1 的 ping 校验不刷新数据包时间，可能误丢弃有效空闲连接。
              value: "-Duser.timezone=UTC -Ddruid.mysql.usePingMethod=false"
            - name: APP_AUTH_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: jwt-signing-key
            - name: APP_AUTH_INTERNAL_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: internal-agent-token
            - name: APP_AUTH_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: bootstrap-admin-username
            - name: APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: bootstrap-admin-password
            - name: APP_AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME
              value: "System Administrator"
            # Intentionally grants administrator access to every client that can
            # reach this API, without exposing the administrator password to the frontend.
            - name: APP_AUTH_DIRECT_LOGIN_ENABLED
              value: "true"
            - name: APP_AUTH_DIRECT_LOGIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: topic4-auth-secrets
                  key: bootstrap-admin-username
            - name: PRIVACY_LEGACY_A_DATASET_ID
              value: "28"
            - name: PRIVACY_LEGACY_A_DATASET_VERSION
              value: "v1"
            - name: PRIVACY_LEGACY_A_FIELDS
              value: "value"
            - name: PRIVACY_LEGACY_B_DATASET_ID
              value: "29"
            - name: PRIVACY_LEGACY_B_DATASET_VERSION
              value: "v1"
            - name: PRIVACY_LEGACY_B_FIELDS
              value: "value"
            - name: PRIVACY_LEGACY_C_DATASET_ID
              value: "30"
            - name: PRIVACY_LEGACY_C_DATASET_VERSION
              value: "v1"
            - name: PRIVACY_LEGACY_C_FIELDS
              value: "value"
            - name: APP_RUNTIME_IMAGE_VERIFY_NAMESPACE
              value: "topic4-1"
            # Match the daily bounded network probe plus a two-hour reporting allowance.
            - name: APP_NETWORK_TOPOLOGY_STALE_AFTER_SECONDS
              value: "93600"
            - name: APP_DATASET_ACCESS_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: dataset-access-hmac
                  optional: true
            - name: APP_DATASET_ACCESS_REVIEWER_A_SECRET
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: reviewer-a-secret
                  optional: true
            - name: APP_DATASET_ACCESS_REVIEWER_B_SECRET
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: reviewer-b-secret
                  optional: true
            - name: APP_SECURE_AGGREGATION_WORKER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: aggregation-worker-auth
                  optional: true
            - name: PRIVACY_PARTY_A_NODE_NAME
              value: "alibj"
            - name: PRIVACY_PARTY_B_NODE_NAME
              value: "alihz"
            - name: PRIVACY_PARTY_C_NODE_NAME
              value: "alish"
            - name: PRIVACY_MP_SPDZ_BASE_URL
              value: "http://topic4-privacy-mpspdz-gateway.kuscia-master.svc.cluster.local:8080"
            - name: PRIVACY_SECRETFLOW_BASE_URL
              value: "http://topic4-privacy-secretflow-gateway.kuscia-master.svc.cluster.local:8080"
            - name: PRIVACY_APSI_BASE_URL
              value: "http://topic4-privacy-apsi-gateway.kuscia-master.svc.cluster.local:8080"
            - name: PRIVACY_SFL_BASE_URL
              value: "http://topic4-privacy-sfl-gateway.kuscia-master.svc.cluster.local:8080"
            - name: PRIVACY_MP_SPDZ_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: privacy-mpspdz-token
            - name: PRIVACY_SECRETFLOW_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: privacy-secretflow-token
            - name: PRIVACY_APSI_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: privacy-apsi-token
            - name: PRIVACY_SFL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topic4-acceptance-secrets
                  key: privacy-sfl-token

            # MySQL
            - name: SPRING_DATASOURCE_DRUID_URL
              value: "jdbc:mysql://mysql.topic4-1.svc.cluster.local:3306/Project4?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&sessionVariables=time_zone='%2B00:00'"
            - name: SPRING_DATASOURCE_DRUID_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_DRUID_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project4-mysql-secret
                  key: root-password

            # Redis（与 application.yml 中 host 保持一致）
            - name: SPRING_REDIS_HOST
              value: "redis-service.default.svc.cluster.local"
            - name: SPRING_REDIS_PORT
              value: "26379"
            - name: SPRING_REDIS_DATABASE
              # 新集群使用 Redis Cluster，只支持 database 0。
              value: "0"

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
