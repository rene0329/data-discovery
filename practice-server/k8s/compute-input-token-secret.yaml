# Administrator bootstrap. The backend can only get/update this one pre-existing Secret.
# Credentials are added dynamically; never commit live Secret data or tokens to this file.
apiVersion: v1
kind: Secret
metadata:
  name: topic4-compute-input-tokens
  namespace: default
type: Opaque
data: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: topic4-compute-input-token-writer
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["topic4-compute-input-tokens"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: topic4-compute-input-token-writer
  namespace: default
subjects:
  - kind: ServiceAccount
    name: default
    namespace: topic4-1
roleRef:
  kind: Role
  name: topic4-compute-input-token-writer
  apiGroup: rbac.authorization.k8s.io
