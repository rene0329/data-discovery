apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: topic4-1
  labels:
    app: project4-mysql
spec:
  type: ClusterIP
  selector:
    workload.user.cattle.io/workloadselector: apps.deployment-topic4-1-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: topic4-1
  labels:
    app: project4-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    # 保留现有 Rancher Deployment 的不可变 selector。
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-topic4-1-mysql
  template:
    metadata:
      labels:
        app: project4-mysql
        workload.user.cattle.io/workloadselector: apps.deployment-topic4-1-mysql
    spec:
      nodeSelector:
        kubernetes.io/hostname: master-88
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: mysql
          image: mysql:8.0.42
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project4-mysql-secret
                  key: root-password
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          hostPath:
            path: /var/lib/topic4-1/mysql
            type: DirectoryOrCreate
