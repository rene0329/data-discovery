name: Mirror pinned privacy runtime images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TARGET: ghcr.io/rene0329/data-discovery-practice-server

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: privacy-kuscia-1.2.0b0-amd64
            source: docker.io/secretflow/kuscia@sha256:73bb8180ca9d7fdb0c984ab9ea4ed4f9c4e3b300b98b168098841028e4373f54
          - tag: privacy-secretflow-lite-1.11.0b1-amd64
            source: docker.io/secretflow/secretflow-lite-anolis8@sha256:f0033a79e71f1f76656230d0f3cd31cbddc8d3bdcdb39fe2fd2afc8b000ec178
          - tag: privacy-python-3.10.3-bullseye-amd64
            source: docker.io/library/python@sha256:460573a11357df4f338df5b5afe8ac1fddb6338391a318296fe9b13bd919319b
          - tag: privacy-secretflow-release-ci-20250228-amd64
            source: docker.io/secretflow/release-ci@sha256:b84f9cacf93a20963811addc794ef1b92ccc3a86c7e94c7994a91e2f10f305c0
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Copy immutable linux/amd64 manifest
        run: docker buildx imagetools create --tag "${TARGET}:${{ matrix.tag }}" "${{ matrix.source }}"
      - name: Verify target image
        run: docker buildx imagetools inspect "${TARGET}:${{ matrix.tag }}"
