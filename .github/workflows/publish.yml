name: Build and Push data-discovery Image

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 下载仓库代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 配置 JDK 8
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 编译打包并运行依赖模块与 Agent 测试
      - name: Build with Maven
        run: mvn -pl data-discovery-daemonset-service -am package

      # 4. 将镜像名转为小写（Docker 不允许大写）
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 5. 登录 GitHub 容器镜像仓库 (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. 构建并推送镜像（Dockerfile 在 data-discovery-daemonset-service/ 子目录）
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: data-discovery-daemonset-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v-${{ github.sha }}
