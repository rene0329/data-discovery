name: Build and Push heat-update-cronjob Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'heat-update-cronjob-service/**'
      - 'practice-common/**'
      - 'practice-pojo/**'
      - 'practice-server/**'
      - '.github/workflows/publish-heat-update.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-heat-update-cronjob

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # 编译 heat-update-cronjob 及其所有依赖模块
      - name: Build with Maven
        run: mvn -pl heat-update-cronjob-service -am package -DskipTests

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: heat-update-cronjob-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v-${{ github.sha }}
