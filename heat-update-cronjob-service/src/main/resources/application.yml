spring:
  application:
    name: heat-update-cronjob-service
  profiles:
    active: dev  # 激活 dev 配置文件（可选，如果有 application-dev.yml）
  main:
    allow-circular-references: true  # PageHelperAutoConfiguration 循环依赖，Spring Boot 2.6+ 默认禁止，需显式允许

  # 数据库连接池配置（必须完整定义，否则失败）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://10.15.16.40:34036/Project4?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
    username: root
    password: ibdiibdi  # 敏感信息建议用环境变量，如 ${DB_PASSWORD}

# MyBatis 配置（确保 Mapper 可以扫描）
mybatis:
  mapper-locations: classpath*:mapper/*.xml  # classpath* 跨所有 jar 搜索，包括 practice-server 依赖中的 XML
  type-aliases-package: org.example.entity  # 实体类包路径
  configuration:
    map-underscore-to-camel-case: true  # 驼峰映射

# 自定义业务配置（热度参数）
app:
  heat-update:
    alpha: 0.99
    k: 0.05
    lambda0: 0.05
    beta: 0.3
    time: 10
    threshold: 10

# 日志配置（可选，调试用）
logging:
  level:
    root: INFO
    org.example: DEBUG
    org.mybatis: DEBUG  # 查看 MyBatis SQL 执行
    com.alibaba.druid: DEBUG  # 查看 Druid 连接池
