# 目标集群为 Kubernetes 1.18，CronJob 在该版本使用 v1beta1。
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: heat-update-cronjob
  namespace: topic4-1
  labels:
    app: heat-update
spec:
  # 每天执行一次（00:00）
  schedule: "0 0 * * *"
  # 同一时间最多允许 1 个 Job 并发运行
  concurrencyPolicy: Forbid
  # 成功的 Job 不保留，失败的保留 1 次便于排查
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  # 如果错过触发时间超过 120 秒，跳过本次
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      # Job 失败后最多重试 2 次
      backoffLimit: 2
      # Job 超过 300 秒自动终止，防止卡死
      activeDeadlineSeconds: 300
      # Job 完成后 60 秒自动删除 Pod（双保险）
      ttlSecondsAfterFinished: 60
      template:
        metadata:
          labels:
            app: heat-update
        spec:
          restartPolicy: OnFailure

          containers:
            - name: heat-update
              # GitHub Container Registry 镜像地址（由 publish-heat-update.yml workflow 构建推送）
              image: ghcr.io/rene0329/data-discovery-heat-update-cronjob:latest
              imagePullPolicy: Always
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              # 数据库连接信息通过环境变量注入，避免硬编码在镜像中
              env:
                - name: JAVA_TOOL_OPTIONS
                  value: "-Xms128m -Xmx384m"
                - name: SPRING_DATASOURCE_URL
                  value: "jdbc:mysql://mysql.topic4-1.svc.cluster.local:3306/Project4?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8"
                - name: SPRING_DATASOURCE_USERNAME
                  value: "root"
                - name: SPRING_DATASOURCE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: project4-mysql-secret
                      key: root-password
