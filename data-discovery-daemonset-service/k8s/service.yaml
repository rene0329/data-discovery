# NodePort Service：可通过任意节点 IP + nodePort 访问（范围 30000-32767）
apiVersion: v1
kind: Service
metadata:
  name: data-discovery-svc
  namespace: topic4-1
  labels:
    app: data-discovery
spec:
  type: NodePort
  selector:
    app: data-discovery
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080        # 改为你想要的端口（30000-32767）
      name: http
      protocol: TCP
