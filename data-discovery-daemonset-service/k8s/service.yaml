# Headless Service：让其他服务可以通过 DNS 按节点访问
# 格式：<pod-ip>.data-discovery-headless.default.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: data-discovery-headless
  namespace: default
  labels:
    app: data-discovery
spec:
  clusterIP: None          # Headless，直接解析到各 Pod IP
  selector:
    app: data-discovery
  ports:
    - port: 8080
      targetPort: 8080
      name: http
      protocol: TCP
---
# ClusterIP Service：用于统一入口（例如通过端口转发本地测试）
apiVersion: v1
kind: Service
metadata:
  name: data-discovery-svc
  namespace: default
  labels:
    app: data-discovery
spec:
  type: ClusterIP
  selector:
    app: data-discovery
  ports:
    - port: 8080
      targetPort: 8080
      name: http
      protocol: TCP
