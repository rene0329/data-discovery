# ServiceAccount：DaemonSet Pod 使用，用于 Fabric8 In-cluster 认证
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-discovery-sa
  namespace: default
---
# ClusterRole：允许 Pod 读取节点列表（KubernetesConfig.java 中会调用 client.nodes().list()）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-discovery-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-discovery-rolebinding
subjects:
  - kind: ServiceAccount
    name: data-discovery-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: data-discovery-role
  apiGroup: rbac.authorization.k8s.io
