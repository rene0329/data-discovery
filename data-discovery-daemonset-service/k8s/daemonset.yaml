apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: data-discovery-daemonset
  namespace: topic4-1
  labels:
    app: data-discovery
spec:
  selector:
    matchLabels:
      app: data-discovery
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: data-discovery
    spec:
      serviceAccountName: data-discovery-sa
      tolerations:
        # 若需要在 master/control-plane 节点也运行，保留这两条；否则删除
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      # ── 节点选择：只在打了 node-role=storage 或 node-role=compute-storage 标签的节点运行 ──
      # 打标签命令：kubectl label node <node-name> node-role=storage
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role
                    operator: In
                    values:
                      - storage
                      - compute-storage

      # hostNetwork=true：Pod 直接使用宿主机网络，Pod IP = 节点 IP，重启后 IP 不变
      # 这样 practice-server 可以通过 node_management.internal_ip 稳定寻址，无需 DNS
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet  # hostNetwork 下保持集群 DNS 可用

      containers:
        - name: data-discovery
          # ⚠️ 替换为实际构建并推送的镜像地址
          image: ghcr.io/rene0329/data-discovery:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            # 节点名称：由 K8s 自动注入当前 Pod 所在节点名，与 node_management 表对应
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # 生产模式：真实扫描文件；改为 dev 则使用 Mock 数据
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            # 数据扫描目录（与下方 volumeMounts.mountPath 保持一致）
            - name: FILE_DISCOVERY_DATA_DIRECTORY
              value: "/dataset"

            # 扫描间隔（毫秒）
            - name: FILE_DISCOVERY_SCAN_INTERVAL_MS
              value: "60000"

            # MySQL 连接
            - name: SPRING_DATASOURCE_DRUID_URL
              value: "jdbc:mysql://mysql.topic4-1.svc.cluster.local:3306/Project4?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8"
            - name: SPRING_DATASOURCE_DRUID_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_DRUID_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project4-mysql-secret
                  key: root-password

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /data-discovery/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /data-discovery/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          volumeMounts:
            - name: host-dataset
              mountPath: /dataset          # Pod 内路径，与 FILE_DISCOVERY_DATA_DIRECTORY 一致

      volumes:
        - name: host-dataset
          hostPath:
            path: /dataset                 # 宿主机上的实际路径
            type: DirectoryOrCreate
